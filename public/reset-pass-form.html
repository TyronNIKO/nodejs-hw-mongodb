<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password form</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <section>
            <div class="container">
                <h1>Reset password form</h1>
                <div class="current-token" editable="true"></div>
                <form action="" class="new-pass-form">
                    <input type="text" name="password" placeholder="New password">
                    <input type="text" name="password-check" placeholder="Repeat password">
                    <button type="submit" class="btn btn-blue">New password</button>
                </form>
            </div>
        </section>
    </main>
    <script type="module">
        import axios from 'https://cdn.jsdelivr.net/npm/axios@1.3.5/+esm';

        const form = document.querySelector('form');
        const password = document.querySelector('input[name="password"]');
        const password2 = document.querySelector('input[name="password-check"]');
        const currentToken = document.querySelector('.current-token');
        let valid = false;
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        currentToken.textContent=token;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log(e.target.password.value);
            const data = { password: e.target.password.value, token }
            if (!valid) {
                return;
            }
            try {
                const response = await axios.post('/auth/reset-pwd', data)
                console.log(response);
            } catch (error) {
                console.log(error);
            }
        })
        password2.addEventListener('input', (e) => {
            console.log(e.target.value);
            let message = "";
            const button = document.querySelector('button[type="submit"]');
            if (password.value !== e.target.value ) {
                console.log("not ok");
                message = "Passwords do not match";
                password.style.borderColor="red";
                password2.style.borderColor="red";
                // button.disabled = true;
                valid = false;
            }else {
                console.log("ok");
                message = "";
                password.style.borderColor="black";
                password2.style.borderColor="black";
                // button.disabled = false;
                valid = true;
            }
            document.querySelector('span').remove();
            password2.insertAdjacentHTML('afterend', `<span style="color: red;">${message}</span>`);

        })
    </script>
    <style>

    </style>
</body>

</html>
