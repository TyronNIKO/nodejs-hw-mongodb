tags:
    - Auth
summary: 'Реєстрація користувача'
operationId: registerUser
requestBody:
    description: 'Інформація для реєстрації'
    required: true
    content:
        application/json:
            schema:
                type: object
                properties:
                    username:
                        type: string
                        example: 'user@example.com'
                    password:
                        type: string
                        example: 'password123'
                    fullName:
                        type: string
                        example: 'John Doe'
responses:
    '201':
        description: 'Користувач успішно зареєстрований'
        content:
            application/json:
                schema:
                    type: object
                    properties:
                        id:
                            type: string
                            example: '1234567890abcdef'
                        username:
                            type: string
                            example: 'user@example.com'
    '400':
        $ref: '../../../components/responses/400.yaml'
