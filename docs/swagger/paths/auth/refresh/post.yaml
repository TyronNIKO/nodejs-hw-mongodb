tags:
    - Auth
summary: Новоти сесію і токен
operationId: refreshUsersSession
requestBody:
    description: 'Інформація для авторизації'
    required: true
    content:
        application/json:
            schema:
                type: object
                properties:
                    username:
                        type: string
                        example: 'user@example.com'
                    password:
                        type: string
                        example: 'password123'
responses:
    '200':
        description: 'Успішний вхід'
        content:
            application/json:
                schema:
                    type: object
                    properties:
                        token:
                            type: string
                            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    '400':
        $ref: '../../../components/responses/400.yaml'
