tags:
    - Contacts
summary: Створити новий контакт
operationId: createContact
description: Цей ендпоінт дозволяє створити новий контакт.
security:
    - bearerAuth: []
requestBody:
    content:
        multipart/form-data:
            schema:
                type: object
                required:
                    - _id
                    - name
                    - phoneNumber
                    - contactType
                properties:
                    _id:
                        description: "Contact's id"
                        type: string
                        example: 65e4decdd286b30065d54af9
                    name:
                        description: "Contact's name"
                        type: string
                        example: 'John Doe'
                    phoneNumber:
                        description: "Contact's phone number"
                        type: string
                        example: '+380501234567'
                    email:
                        description: "Contact's email"
                        type: string
                        example: 'name_surname@example.com'
                    contactType:
                        description: "Contact's type"
                        type: string
                        enum: ['male', 'female', 'other']
                    userId:
                        description: "Contact's creator/refferer user id"
                        type: string
                        example: 65e4decdd286b30065d54af9
                    photo:
                        description: "Link to contact's photo"
                        type: string
                        example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
responses:
    '201':
        description: Creates a contact
        content:
            application/json:
                schema:
                    type: object
                    required:
                        - status
                        - message
                        - data
                    properties:
                        status:
                            type: integer
                            example: 201
                        message:
                            type: string
                            example: Successfully created a contact!
                        data:
                            type: object
                            $ref: '../../components/schemas/contact.yaml'
    '401':
        $ref: '../../components/responses/401.yaml'
