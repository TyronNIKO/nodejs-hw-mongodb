tags:
    - Contacts
summary: Оновити контакт
operationId: getContactById
description: Цей ендпоінт дозволяє оновити інформацію про контакт за його унікальним ідентифікатором.
security:
    - bearerAuth: []
parameters:
    - in: path
      name: contactId
      required: true
      schema:
          type: string
          example: '65ca67e7ae7f10c88b598384'
      description: Унікальний ідентифікатор контакту
responses:
    '200':
        description: Successfully found contact with id ${contactId}!
        content:
            application/json:
                schema:
                    type: object
                    required:
                      - status
                      - message
                      - data
                    properties:
                      status:
                        type: integer
                        example: 200
                      message:
                        type: string
                        example: Successfully found contact with id 65ca67e7ae7f10c88b598384!
                      data:
                        type: object
                        $ref: '../../../components/schemas/contact.yaml'
    '404':
        $ref: '../../../components/responses/404.yaml'
        description: Contact with this ID not found
        content:
            application/json:
                schema:
                    type: object
                    properties:
                        message:
                            type: string
                            example: 'Contact with this ID not found'
